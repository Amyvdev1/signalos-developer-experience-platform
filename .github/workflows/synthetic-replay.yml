name: Synthetic replay
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run report
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-payment-investigation
          path: output/
